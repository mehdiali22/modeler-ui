<p>seed works!</p>
<div class="page" dir="rtl">
  <section class="card">
    <div class="head">
      <div class="title">Seed / Bootstrap</div>
      <div class="sub">دیتای پایه برای تست سریع V3</div>
    </div>

    <div class="actions">
      <button type="button" class="btn primary" (click)="seed(false)">Seed (If Empty)</button>
      <button type="button" class="btn" (click)="seed(true)">Seed (Overwrite)</button>
      <button type="button" class="btn danger" (click)="clearAll()">Clear All</button>
    </div>

    <div class="hint">
      پیشنهاد: اول <b>Seed (Overwrite)</b> بزن، بعد برو <b>/explorer</b> و <b>/scenarios</b> تا زنجیره‌ها رو ببینی.
    </div>

    <div class="log" *ngIf="log.length">
      <div class="logline" *ngFor="let l of log">{{ l }}</div>
    </div>
  </section>
</div>
