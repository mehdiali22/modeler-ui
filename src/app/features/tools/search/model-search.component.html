<div class="page">
  <div class="head">
    <div class="title">Model Search</div>

    <div class="tools">
      <input class="inp"
             placeholder="جستجو در کل مدل..."
             [value]="q"
             (input)="q = $any($event.target).value; search()" />

      <select class="inp sm"
              [value]="col"
              (change)="col = $any($event.target).value; search()">
        <option value="">همه</option>
        <option value="processes">processes</option>
        <option value="stages">stages</option>
        <option value="artifacts">artifacts</option>
        <option value="facts">facts</option>
        <option value="conditions">conditions</option>
        <option value="actors">actors</option>
        <option value="actions">actions</option>
        <option value="triggers">triggers</option>
        <option value="events">events</option>
        <option value="scenarios">scenarios</option>
        <option value="scenarioDecision">scenario decisions</option>
        <option value="eventTriggerLinks">eventTriggerLinks</option>
      </select>

      <label class="chk">
        <input type="checkbox" [checked]="includeJson"
               (change)="includeJson = $any($event.target).checked; search()">
        include JSON
      </label>

      <label class="chk">
        <input type="checkbox" [checked]="includeDecisions"
               (change)="includeDecisions = $any($event.target).checked; search()">
        include decisions
      </label>

      <input class="inp xs"
             type="number"
             min="10" max="1000"
             title="limit"
             [value]="limit"
             (input)="limit = +$any($event.target).value; search()" />

      <button class="btn" (click)="reload(); search()">Reload</button>
      <button class="btn" (click)="copyResults()">Copy</button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Results ({{ hits.length }})</div>

    <table class="tbl">
      <thead>
        <tr>
          <th>Type</th>
          <th>Key</th>
          <th>Field</th>
          <th>Snippet</th>
          <th>Open</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let h of hits">
          <td class="mono">{{ h.col }}</td>
          <td class="mono">{{ h.key }}</td>
          <td class="mono">{{ h.field }}</td>
          <td class="mono snippet">{{ h.snippet }}</td>
          <td>
            <a class="btn sm"
               [routerLink]="['/tools/open']"
               [queryParams]="h.open">
              باز کردن
            </a>
          </td>
        </tr>

        <tr *ngIf="!hits.length">
          <td colspan="5" class="muted center">چیزی پیدا نشد (یا متن جستجو خالی است)</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
