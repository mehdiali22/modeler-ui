<div class="page">
  <div class="head">
    <div class="title">{{ title || 'Open Entity' }}</div>

    <div class="tools">
      <a class="btn" routerLink="/tools/validation">Validation</a>
      <a class="btn" routerLink="/flow">Flow</a>
      <button class="btn" (click)="copy()">Copy</button>
      <button class="btn primary" (click)="save()">Save</button>
    </div>
  </div>

  <div class="card" *ngIf="error">
    <div class="err">{{ error }}</div>
  </div>

  <div class="card" *ngIf="!error">
    <div class="meta mono">
      col={{ col }} | id={{ id }} <span *ngIf="decisionId">| decisionId={{ decisionId }}</span>
    </div>

    <textarea class="inp mono"
              rows="24"
              [value]="jsonText"
              (input)="jsonText = $any($event.target).value"></textarea>
  </div>
</div>
