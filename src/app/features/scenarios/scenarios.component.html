<div class="page">
  <div class="head">
    <div class="title">Scenarios</div>
    <div class="tools">
      <button class="btn" (click)="reload()">Reload</button>
      <button class="btn primary" (click)="addScenario()">+ Add Scenario</button>
    </div>
  </div>
  <div class="alert" *ngIf="error">{{ error }}</div>

  <div class="grid">
    <!-- list -->
    <div class="card">
      <div class="card-title">List</div>

      <table class="tbl">
        <thead>
          <tr>
            <th>Key</th>
            <th>Stage</th>
            <th>Title</th>
            <th></th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let r of rows" [class.active]="r.id===editingId">
            <td class="mono">{{ r.scenarioKey }}</td>
            <td class="mono">{{ stageTitle(r.stageId) }}</td>
            <td>{{ r.titleFa }}</td>
            <td class="right">
              <button class="btn sm" (click)="editRow(r.id)">Edit</button>
              <button class="btn sm danger" (click)="removeScenario(r.id)">Delete</button>
            </td>
          </tr>

          <tr *ngIf="!rows.length">
            <td colspan="4" class="muted center">هیچ سناریویی ندارید</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- editor -->
    <div class="card" *ngIf="edit">
      <div class="card-title">
        Editor
        <div class="tools">
          <button class="btn sm" (click)="cancelEdit()">Cancel</button>
          <button class="btn sm primary" (click)="saveEdit()">Save</button>
        </div>
      </div>

      <div class="form">
        <div class="row2">
          <div>
            <div class="lbl">Scenario Key</div>
            <input class="inp mono" [value]="edit.scenarioKey"
                   (input)="edit.scenarioKey = $any($event.target).value">
          </div>

          <div>
            <div class="lbl">Owner Subdomain</div>
            <input class="inp" [value]="edit.ownerSubdomain || ''"
                   (input)="edit.ownerSubdomain = $any($event.target).value">
          </div>
        </div>

        <div class="row2">
          <div>
            <div class="lbl">Title (FA)</div>
            <input class="inp" [value]="edit.titleFa || ''"
                   (input)="edit.titleFa = $any($event.target).value">
          </div>

          <div>
            <div class="lbl">Stage</div>
            <app-smart-select [options]="stageOptions"
                              [value]="edit.stageId"
                              (valueChange)="edit.stageId = ($event ?? edit.stageId)">
            </app-smart-select>
          </div>
        </div>

        <div class="row2">
          <div>
            <div class="lbl">Trigger</div>
            <app-smart-select [options]="triggerOptions"
                              [value]="edit.triggerId ?? null"
                              (valueChange)="edit.triggerId = ($event ?? undefined)">
            </app-smart-select>
          </div>

          <div>
            <div class="lbl">Description</div>
            <input class="inp" [value]="edit.description || ''"
                   (input)="edit.description = $any($event.target).value">
          </div>
        </div>

        <app-ref-multi-select label="Preconditions"
                              [options]="condOptions"
                              [selectedIds]="scenarioPreconditionIds"
                              (selectedIdsChange)="scenarioPreconditionIds = $event">
        </app-ref-multi-select>

        <app-ref-multi-select label="Produced Events (Scenario-level)"
                              [options]="eventOptions"
                              [selectedIds]="scenarioProducedEventIds"
                              (selectedIdsChange)="scenarioProducedEventIds = $event">
        </app-ref-multi-select>

      </div>
    </div>
  </div>
</div>
