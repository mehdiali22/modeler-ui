<div class="page" dir="rtl">
  <section class="card">
    <div class="head">
      <div class="title">SubProcess Catalog</div>
      <div class="sub">زیر‌فرایندهای هر Process</div>
    </div>

    <div class="warn" *ngIf="!processes.length">
      اول باید حداقل یک Process بسازی.
    </div>

    <div class="form" *ngIf="processes.length">
      <label>Process</label>
      <select class="inp" [value]="draft.processId" (change)="draft.processId = +$any($event.target).value">
        <option *ngFor="let p of processes" [value]="p.id">
          {{ p.processKey }}{{ p.titleFa ? (' — ' + p.titleFa) : '' }}
        </option>
      </select>

      <label>SubProcessKey</label>
      <input class="inp"
             [value]="draft.subProcessKey"
             (input)="draft.subProcessKey = $any($event.target).value"
             placeholder="مثلا DaramadHospitalReview" />

      <label>عنوان</label>
      <input class="inp"
             [value]="draft.titleFa"
             (input)="draft.titleFa = $any($event.target).value" />

      <label>Order</label>
      <input class="inp"
             [value]="draft.order"
             (input)="draft.order = $any($event.target).value"
             placeholder="مثلا 20" />

      <label>توضیحات</label>
      <textarea class="inp ta" rows="3"
                [value]="draft.description"
                (input)="draft.description = $any($event.target).value"></textarea>

      <div class="actions">
        <button type="button" class="btn ghost" (click)="reset()">ریست</button>
        <button type="button" class="btn primary" (click)="submit()">
          {{ editingId !== null ? 'ذخیره' : 'افزودن' }}
        </button>
      </div>

      <div class="error" *ngIf="error">{{ error }}</div>
    </div>
  </section>

  <section class="card">
    <div class="head"><div class="title">لیست</div></div>

    <div class="table-wrap" *ngIf="rows.length; else empty">
      <table class="tbl">
        <thead>
          <tr>
            <th>SubProcessKey</th>
            <th>Process</th>
            <th>عنوان</th>
            <th>Order</th>
            <th class="w-op">عملیات</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of rows">
            <td><b>{{ r.subProcessKey }}</b></td>
            <td class="muted">{{ processKeyById(r.processId) }}</td>
            <td class="muted">{{ r.titleFa || '—' }}</td>
            <td class="muted">{{ r.order ?? '—' }}</td>
            <td class="ops">
              <button class="icon-btn" type="button" (click)="edit(r)">✏️</button>
              <button class="icon-btn danger" type="button" (click)="remove(r)">🗑️</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #empty>
      <div class="empty">رکوردی ثبت نشده است.</div>
    </ng-template>
  </section>
</div>
