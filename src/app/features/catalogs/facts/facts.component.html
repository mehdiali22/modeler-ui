<div class="page" dir="rtl">
  <section class="card">
    <div class="head">
      <div class="title">Fact Catalog</div>
      <div class="sub">Local (temporary)</div>
    </div>

    <div class="form">
      <label>Artifact</label>
      <select class="inp"
              [value]="draft.artifactId"
              (change)="draft.artifactId = $any($event.target).value">
        <option value="" disabled>انتخاب...</option>
        <option *ngFor="let a of artifacts" [value]="a.id">
          {{ a.artifactKey }}{{ a.titleFa ? (' — ' + a.titleFa) : '' }}
        </option>
      </select>

      <label>FactKey</label>
      <input class="inp"
             [value]="draft.factKey"
             (input)="draft.factKey = $any($event.target).value"
             placeholder="مثلا Case.Status یا KSR.DisputeCount" />

      <label>ValueType</label>
      <select class="inp"
              [value]="draft.valueType"
              (change)="draft.valueType = +$any($event.target).value">
        <option *ngFor="let t of valueTypes" [value]="t.id">{{ t.title }}</option>
      </select>

      <label>Meaning</label>
      <textarea class="inp ta"
                rows="3"
                [value]="draft.meaning"
                (input)="draft.meaning = $any($event.target).value"></textarea>

      <div class="actions">
        <button type="button" class="btn ghost" (click)="reset()">ریست</button>
        <button type="button" class="btn primary" (click)="submit()">
          {{ editingId ? 'ذخیره' : 'افزودن' }}
        </button>
      </div>

      <div class="error" *ngIf="error">{{ error }}</div>
    </div>
  </section>

  <section class="card">
    <div class="head">
      <div class="title">لیست</div>
    </div>

    <div class="table-wrap" *ngIf="rows.length; else empty">
      <table class="tbl">
        <thead>
          <tr>
            <th>FactKey</th>
            <th>Artifact</th>
            <th>Type</th>
            <th>Meaning</th>
            <th class="w-op">عملیات</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of rows">
            <td><b>{{ r.factKey }}</b></td>
            <td class="muted">{{ artifactTitle(r.artifactId) }}</td>
            <td class="muted">{{ valueTypeTitle(r.valueType) }}</td>
            <td class="muted">{{ r.meaning || '—' }}</td>
            <td class="ops">
              <button class="icon-btn" type="button" (click)="edit(r)">✏️</button>
              <button class="icon-btn danger" type="button" (click)="remove(r)">🗑️</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #empty>
      <div class="empty">رکوردی ثبت نشده است.</div>
    </ng-template>
  </section>
</div>
