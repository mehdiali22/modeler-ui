<div class="page" dir="rtl">
  <section class="card">
    <div class="head">
      <div class="title">Fact Catalog</div>
      <div class="sub">Version-scoped</div>
    </div>

    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <label>Artifact</label>
      <select class="inp" formControlName="artifactId">
        <option *ngFor="let a of artifacts" [value]="a.id">
          {{ a.artifactKey }} {{ a.titleFa ? ('— ' + a.titleFa) : '' }}
        </option>
      </select>

      <label>FactKey</label>
      <input class="inp" formControlName="factKey" placeholder="مثلا Case.Status یا KSR.DisputeCount" />

      <label>ValueType</label>
      <select class="inp" formControlName="valueType">
        <option *ngFor="let t of valueTypes" [ngValue]="t.id">{{ t.title }}</option>
      </select>

      <label>Meaning</label>
      <textarea class="inp ta" rows="3" formControlName="meaning"></textarea>

      <div class="actions">
        <button type="button" class="btn ghost" (click)="reset()">ریست</button>
        <button type="submit" class="btn primary">{{ editingId ? 'ذخیره' : 'افزودن' }}</button>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="head">
      <div class="title">لیست</div>
    </div>

    <div class="table-wrap" *ngIf="rows.length; else empty">
      <table class="tbl">
        <thead>
          <tr>
            <th>FactKey</th>
            <th>Artifact</th>
            <th>Type</th>
            <th>Meaning</th>
            <th class="w-op">عملیات</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of rows">
            <td><b>{{ r.factKey }}</b></td>
            <td class="muted">{{ artifactTitle(r.artifactId) }}</td>
            <td class="muted">{{ r.valueType }}</td>
            <td class="muted">{{ r.meaning || '—' }}</td>
            <td class="ops">
              <button class="icon-btn" type="button" (click)="edit(r)">✏️</button>
              <button class="icon-btn danger" type="button" (click)="remove(r)">🗑️</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #empty>
      <div class="empty">رکوردی ثبت نشده است.</div>
    </ng-template>
  </section>
</div>
