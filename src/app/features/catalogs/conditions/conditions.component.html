<div class="page" dir="rtl">
  <section class="card">
    <div class="head">
      <div class="title">Condition Catalog</div>
      <div class="sub">Expression + FactsUsed</div>
    </div>

    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <label>ConditionKey</label>
      <input class="inp" formControlName="conditionKey" placeholder="مثلا CASE_C_IncomeCanStartActivity" />

      <label>عنوان</label>
      <input class="inp" formControlName="titleFa" />

      <label>Expression</label>
      <textarea class="inp ta" rows="4" formControlName="expression"
                placeholder='مثلا: Case.IncomeOwnershipState == "Free"'></textarea>

      <label>FailMessage</label>
      <input class="inp" formControlName="failMessage" />

      <!-- FactsUsed -->
      <div class="facts-panel">
        <div class="facts-head">
          <div class="facts-title">Facts Used</div>
          <input class="inp small" [(ngModel)]="factFilter" name="factFilter" placeholder="جستجو Fact..." />
        </div>

        <div class="facts-list">
          <div class="fact-row" *ngFor="let f of filteredFacts">
            <label class="fact-item">
              <input type="checkbox" [checked]="isFactSelected(f.id)" (change)="toggleFact(f.id)" />
              <span class="fact-key">{{ f.factKey }}</span>
              <span class="fact-meaning">{{ f.meaning || '' }}</span>
            </label>
          </div>

          <div class="empty-mini" *ngIf="!filteredFacts.length">Factی پیدا نشد.</div>
        </div>
      </div>

      <div class="actions">
        <button type="button" class="btn ghost" (click)="reset()">ریست</button>
        <button type="submit" class="btn primary">{{ editingId ? 'ذخیره' : 'افزودن' }}</button>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="head">
      <div class="title">لیست</div>
    </div>

    <div class="table-wrap" *ngIf="rows.length; else empty">
      <table class="tbl">
        <thead>
          <tr>
            <th>ConditionKey</th>
            <th>عنوان</th>
            <th>Expression</th>
            <th>FactsUsed</th>
            <th class="w-op">عملیات</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of rows">
            <td><b>{{ r.conditionKey }}</b></td>
            <td class="muted">{{ r.titleFa || '—' }}</td>
            <td class="muted">{{ r.expression }}</td>
            <td class="muted">{{ factsUsedText(r.factIdsUsed) }}</td>
            <td class="ops">
              <button class="icon-btn" type="button" (click)="edit(r)">✏️</button>
              <button class="icon-btn danger" type="button" (click)="remove(r)">🗑️</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #empty>
      <div class="empty">رکوردی ثبت نشده است.</div>
    </ng-template>
  </section>
</div>
