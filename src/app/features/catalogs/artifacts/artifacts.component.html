<div class="page" dir="rtl">
  <section class="card">
    <div class="head">
      <div class="title">Artifact Catalog</div>
      <div class="sub">Version-scoped</div>
    </div>

    <form class="form" [formGroup]="form" (ngSubmit)="submit()">
      <label>ArtifactKey</label>
      <input class="inp" formControlName="artifactKey" placeholder="مثلا Case یا KSR" />

      <label>عنوان</label>
      <input class="inp" formControlName="titleFa" />

      <label>توضیحات</label>
      <textarea class="inp ta" rows="3" formControlName="description"></textarea>

      <label>زیرمجموعه Case؟</label>
      <input type="checkbox" formControlName="isChildOfCase" />

      <div class="actions">
        <button type="button" class="btn ghost" (click)="reset()">ریست</button>
        <button type="submit" class="btn primary">{{ editingId ? 'ذخیره' : 'افزودن' }}</button>
      </div>
    </form>
  </section>

  <section class="card">
    <div class="head">
      <div class="title">لیست</div>
    </div>

    <div class="table-wrap" *ngIf="rows.length; else empty">
      <table class="tbl">
        <thead>
          <tr>
            <th>ArtifactKey</th>
            <th>عنوان</th>
            <th>ChildOfCase</th>
            <th class="w-op">عملیات</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of rows">
            <td><b>{{ r.artifactKey }}</b></td>
            <td>{{ r.titleFa || '—' }}</td>
            <td>{{ r.isChildOfCase ? 'بله' : 'خیر' }}</td>
            <td class="ops">
              <button class="icon-btn" type="button" (click)="edit(r)">✏️</button>
              <button class="icon-btn danger" type="button" (click)="remove(r)">🗑️</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #empty>
      <div class="empty">رکوردی ثبت نشده است.</div>
    </ng-template>
  </section>
</div>
